dataset:
  name: Elliptic Data Set
  dataset_name: elliptic
  raw_dir: data/raw/elliptic
  processed_dir: data/processed/elliptic
  graph_type: bitcoin_transaction
  directed: true
  weighted: false
  has_timestamps: true
  source: Elliptic Data Set
  paper: "Anti-money laundering in bitcoin: Experimenting with graph convolutional networks for financial forensics"
  citation: weber2019anti
  scenario: "Bitcoin illicit transaction detection and financial forensics"

motif_ground_truth:
  construction: illicit_khop_ego
  k_hop: 1
  max_instances: 1000
  max_edges_per_instance: 200
  seed: 42

standard_format:
  output_dir: data/processed/elliptic
  validation_sample_edges: 500000
